<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="system-ui, sans-serif">
  <rect width="1200" height="800" fill="#f5f5f2"/>
  <!-- sidebar -->
  <rect width="220" height="800" fill="#18181b"/>
  <rect x="28" y="28" width="36" height="36" rx="9" fill="#2563eb"/>
  <text x="76" y="53" fill="#fff" font-size="18" font-weight="700">Acme</text>
  <g fill="#a1a1aa" font-size="15">
    <rect x="16" y="104" width="188" height="38" rx="8" fill="#27272a"/>
    <text x="32" y="129" fill="#fff">Overview</text>
    <text x="32" y="177">Orders</text>
    <text x="32" y="225">Customers</text>
    <text x="32" y="273">Reports</text>
    <text x="32" y="321">Settings</text>
  </g>
  <!-- header -->
  <rect x="252" y="28" width="560" height="44" rx="10" fill="#e9e9e4"/>
  <text x="276" y="56" fill="#71717a" font-size="15">Search</text>
  <rect x="1028" y="28" width="140" height="44" rx="10" fill="#2563eb"/>
  <text x="1098" y="56" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">New order</text>
  <!-- stat cards -->
  <g font-size="14">
    <rect x="252" y="104" width="292" height="128" rx="14" fill="#fff" stroke="#e4e4df"/>
    <text x="276" y="140" fill="#71717a">Revenue</text>
    <text x="276" y="190" fill="#18181b" font-size="36" font-weight="700">$12,480</text>
    <rect x="564" y="104" width="292" height="128" rx="14" fill="#fff" stroke="#e4e4df"/>
    <text x="588" y="140" fill="#71717a">Orders</text>
    <text x="588" y="190" fill="#18181b" font-size="36" font-weight="700">326</text>
    <rect x="876" y="104" width="292" height="128" rx="14" fill="#fff" stroke="#e4e4df"/>
    <text x="900" y="140" fill="#71717a">Avg. order</text>
    <text x="900" y="190" fill="#18181b" font-size="36" font-weight="700">$38.28</text>
  </g>
  <!-- chart -->
  <rect x="252" y="256" width="604" height="512" rx="14" fill="#fff" stroke="#e4e4df"/>
  <text x="276" y="296" fill="#18181b" font-size="18" font-weight="600">Sales this week</text>
  <g fill="#2563eb">
    <rect x="300" y="520" width="44" height="200" rx="6"/>
    <rect x="374" y="460" width="44" height="260" rx="6"/>
    <rect x="448" y="560" width="44" height="160" rx="6"/>
    <rect x="522" y="400" width="44" height="320" rx="6"/>
    <rect x="596" y="480" width="44" height="240" rx="6"/>
    <rect x="670" y="360" width="44" height="360" rx="6"/>
    <rect x="744" y="430" width="44" height="290" rx="6"/>
  </g>
  <!-- list -->
  <rect x="876" y="256" width="292" height="512" rx="14" fill="#fff" stroke="#e4e4df"/>
  <text x="900" y="296" fill="#18181b" font-size="18" font-weight="600">Top items</text>
  <g font-size="15" fill="#3f3f46">
    <text x="900" y="350">Flat white</text><text x="1144" y="350" text-anchor="end">142</text>
    <text x="900" y="400">Croissant</text><text x="1144" y="400" text-anchor="end">97</text>
    <text x="900" y="450">Iced latte</text><text x="1144" y="450" text-anchor="end">88</text>
    <text x="900" y="500">Banana bread</text><text x="1144" y="500" text-anchor="end">61</text>
    <text x="900" y="550">Chai</text><text x="1144" y="550" text-anchor="end">44</text>
  </g>
</svg>
